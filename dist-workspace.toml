[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Only the server binary is distributed — the other 10 workspace crates are
# internal libraries (they stay unpublished; the web UI is data, not a package).
packages = ["flux-server"]
# Extra files/directories copied into the ROOT of every archive, next to the
# binary — matches flux-server's static-layer lookup (`web-ui/` next to the
# binary). The directory is produced per-runner by .github/build-setup.yml
# (npm build → web-ui/); it is a build artifact and gitignored.
include = ["web-ui/"]
# Prerequisites injected into EVERY build job before the cargo build
# (.github/build-setup.yml, path relative to .github/workflows/):
# protoc for flux-proto's build.rs + the web-ui/ bundle that `include` packs.
github-build-setup = "../build-setup.yml"
# NOTE on Linux glibc floors: linux-gnu targets build NATIVELY on the
# default runners (ubuntu-22.04 / ubuntu-22.04-arm → glibc 2.35), and dist
# auto-detects that floor for its installer compat checks. dist's
# `min-glibc-version` setting does NOT steer the build toolchain (verified
# on 0.32.0: it only feeds the installer check) — pinning it lower than the
# runner's glibc would make installers advertise compat the binary lacks.
# If wider Linux compat is ever needed, the blessed pattern is a manylinux
# container build (github-custom-runners.<target>.container, see the dist
# ci-customizing guide) or adding an x86_64-unknown-linux-musl target.
