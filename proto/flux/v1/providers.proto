// Provider registry management — pure endpoints, NEVER secrets
// (api_key leaves only at add time, is stored server-side, never returns).
//
// Validation failures (empty id, unknown protocol, duplicate id, unknown
// id on remove) ride the response's inline `error` — request-scoped, never
// a transport status (D4'). Saves never validate connectivity; a bad
// endpoint surfaces at the next round / model probe.
syntax = "proto3";

package flux.v1;

import "flux/v1/common.proto";

service ProviderService {
  // The registered providers, sorted by id.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);

  // Probe one provider's upstream model catalog (the OpenAI-compatible
  // `GET /models`; also validates base URL + API key in one request).
  // Probe failures ride the response's `error`, never a transport status.
  rpc GetModels(GetModelsRequest) returns (GetModelsResponse);

  // Register a provider. An entry is a PURE ENDPOINT: id, interface
  // protocol, url, api_key — NO model (the model is a per-chat pin).
  rpc AddProvider(AddProviderRequest) returns (AddProviderResponse);

  // Remove a provider. Chats pinned to it keep their pin and fail on the
  // next round with an error naming the dead pin (recovery: SwitchChat).
  rpc RemoveProvider(RemoveProviderRequest) returns (RemoveProviderResponse);

  // Edit a provider's endpoint (url / api_key) behind its id. The id is
  // IDENTITY — chat pins and saved models reference it — so it never
  // changes here (rename = remove + re-add). Pinned chats hot-apply the
  // fresh endpoint at their next machine gate (the switch path: cache
  // sync + carried-pin rebuild); no wire notice (the pin didn't move).
  rpc UpdateProvider(UpdateProviderRequest) returns (UpdateProviderResponse);
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated ProviderSummary providers = 1;
}

message GetModelsRequest {
  // The registry id to probe — required (no default to imply).
  string provider = 1;
}

message GetModelsResponse {
  // Sorted by id.
  repeated ModelCatalogEntry models = 1;
  optional string error = 2;
}

message AddProviderRequest {
  string id = 1;
  // Interface protocol — only "openai" is supported. Empty = the server
  // default ("openai"; proto3 scalars have no presence, so absence and
  // "" mean the same thing).
  string protocol = 2;
  // Endpoint base url (bare, no `/chat/completions` suffix). Absent =
  // the OpenAI default base url.
  optional string url = 3;
  optional string api_key = 4;
}

message AddProviderResponse {
  string id = 1;
  optional string error = 2;
}

message RemoveProviderRequest {
  string id = 1;
}

message RemoveProviderResponse {
  string id = 1;
  optional string error = 2;
}

message UpdateProviderRequest {
  // The registry id to edit — unknown ids are refused. NEVER changes:
  // it is the reference chat pins and saved models carry.
  string id = 1;
  // Interface protocol — validated exactly like add (only "openai"
  // today). Empty = the server default.
  string protocol = 2;
  // Endpoint base url. Absent/empty = the OpenAI default base url.
  optional string url = 3;
  // TRI-STATE: absent = KEEP the stored api_key (it never leaves the
  // server, so the client has nothing to resend); present = replace it
  // (empty string clears a stored key).
  optional string api_key = 4;
}

message UpdateProviderResponse {
  string id = 1;
  optional string error = 2;
}
