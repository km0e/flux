// MCP launch-list management — persist-first + LIVE apply: a successful
// add spawns/connects the child, registers its tools into the global
// registry, and the matching chats rebuild at the machine gate. A
// self-healing supervisor respawns a dead child with capped backoff; a
// row whose spawn fails stays (retried at the next server start).
// Validation failures ride the inline `error` (D4').
syntax = "proto3";

package flux.v1;

import "flux/v1/common.proto";

service McpService {
  // The registered servers, sorted by id (env values redacted — keys only).
  rpc ListServers(ListServersRequest) returns (ListServersResponse);

  // Register an MCP server (a stdio child process or a Streamable HTTP
  // endpoint). The list lives in the server database (the server has no
  // config file).
  rpc AddServer(AddServerRequest) returns (AddServerResponse);

  // Remove a registered server (unregisters exactly the tools it
  // registered; a live child is killed).
  rpc RemoveServer(RemoveServerRequest) returns (RemoveServerResponse);
}

message ListServersRequest {}

message ListServersResponse {
  repeated McpServerSummary servers = 1;
}

message AddServerRequest {
  string id = 1;
  // Executable to run.
  string command = 2;
  // Each element is one argument.
  repeated string args = 3;
  // The environment block for the child process. The VALUES never leave
  // the server after this call (summaries carry keys only).
  map<string, string> env = 4;
  // Which transport the row uses. STDIO reads command/args/env; HTTP
  // reads url/headers.
  flux.v1.McpKind kind = 5;
  // The Streamable HTTP endpoint URL (MCP_KIND_HTTP only; e.g.
  // https://example.com/mcp).
  string url = 6;
  // Headers sent with every HTTP request — auth rides here as an
  // ordinary header (e.g. Authorization). The VALUES never leave the
  // server after this call (summaries carry keys only).
  map<string, string> headers = 7;
}

message AddServerResponse {
  string id = 1;
  optional string error = 2;
  // Per-tool registration outcomes on a successful add. Partial success
  // is still success (the row lands, the server runs) — a tool whose
  // name collides is SKIPPED and the reason rides here, visible in the
  // UI instead of only in the server log.
  repeated ToolRegistrationResult results = 3;
}

// One tool's registration outcome (the add ack's per-tool detail).
message ToolRegistrationResult {
  string name = 1;
  bool registered = 2;
  // Why a tool was skipped — absent when registered.
  optional string reason = 3;
}

message RemoveServerRequest {
  string id = 1;
}

message RemoveServerResponse {
  string id = 1;
  optional string error = 2;
}
