# Steps injected into every dist build job (.github/workflows/release.yml
# references this via dist's `github-build-setup` setting, path relative to
# .github/workflows/). NOTE: dist INLINES this fragment into the generated
# release.yml at `dist generate` time — editing this file REQUIRES a
# `dist generate` to refresh that copy, or the plan job's freshness check
# kills the run (`dist generate --check` catches it locally). Two prerequisites every platform needs before the
# cargo build:
#   1. protoc — flux-proto's build.rs compiles proto/ via prost-build.
#   2. web-ui/ — the browser UI bundle, built here so dist's
#      `include = ["web-ui/"]` lands it next to the binary in every archive.
# This fragment REPLACES dist's default build-setup wholesale, so it must
# carry everything every platform needs.
#
# protoc: macOS/Windows come from the runner's own package manager (brew/
# choco track current upstream — proto3 optional is long-stable there).
# Linux CANNOT: the release runners are pinned to ubuntu-22.04 /-arm (the
# glibc 2.35 floor, see dist-workspace.toml) and apt's protobuf-compiler
# there is 3.12.4 — proto3 `optional` is still experimental, so
# flux-proto's build.rs dies with `--experimental_allow_proto3_optional
# was not set` (regression caught on the v0.1.3 tag: CI's rust job runs
# ubuntu-latest = 24.04, protoc 3.21, and can't see it). The Linux step
# below fetches a pinned binary straight from the protobuf release assets
# — a plain HTTPS download (no API, no token, no third-party action;
# arduino/setup-protoc is unmaintained and still declares a node20
# runtime, which GitHub force-runs on node24 with a deprecation warning
# on every job).
- name: Install protoc (Linux)
  if: runner.os == 'Linux'
  shell: bash
  run: |
    PROTOC_VERSION=29.3
    case "$(uname -m)" in
      x86_64) PROTOC_ARCH=x86_64 ;;
      aarch64) PROTOC_ARCH=aarch_64 ;;  # the release asset's spelling
      *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
    esac
    curl -fsSL --retry 3 -o /tmp/protoc.zip \
      "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-${PROTOC_ARCH}.zip"
    sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
    sudo chmod +x /usr/local/bin/protoc
    protoc --version
- name: Install protoc (macOS)
  if: runner.os == 'macOS'
  run: |
    brew install protobuf
- name: Install protoc (Windows)
  if: runner.os == 'Windows'
  run: |
    choco install protoc -y --no-progress

# The web build (package-web.sh) needs the supported toolchain: pnpm from
# the packageManager pin + Node 24 LTS (see AGENTS.md "Toolchain
# environment"). Runner-default node is whatever the image ships — pin it.
- name: Setup pnpm
  uses: pnpm/action-setup@v6
  with:
    package_json_file: clients/package.json
- name: Setup Node.js
  uses: actions/setup-node@v7
  with:
    node-version: 24

- name: Build web UI → web-ui/
  shell: bash
  run: |
    ./scripts/package-web.sh --out "$PWD/web-ui"
