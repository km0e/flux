# Steps injected into every dist build job (.github/workflows/release.yml
# references this via dist's `github-build-setup` setting, path relative to
# .github/workflows/). Two prerequisites every platform needs before the
# cargo build:
#   1. protoc — flux-proto's build.rs compiles proto/ via prost-build.
#   2. web-ui/ — the browser UI bundle, built here so dist's
#      `include = ["web-ui/"]` lands it next to the binary in every archive.
# This fragment REPLACES dist's default build-setup wholesale, so it must
# carry everything every platform needs.
#
# protoc comes from each runner's own package manager — no third-party
# action. arduino/setup-protoc (which dist's older default used) is
# unmaintained (last commit 2024-09) and still declares a node20 runtime,
# which GitHub force-runs on node24 with a deprecation warning on every
# job; the native installs also drop the GitHub-API download (and its
# rate-limit/token dependency). CI's rust job already proves apt's
# protobuf-compiler builds flux-proto; brew/choco are the same class.
- name: Install protoc (Linux)
  if: runner.os == 'Linux'
  run: |
    sudo apt-get update && sudo apt-get install -y protobuf-compiler
- name: Install protoc (macOS)
  if: runner.os == 'macOS'
  run: |
    brew install protobuf
- name: Install protoc (Windows)
  if: runner.os == 'Windows'
  run: |
    choco install protoc -y --no-progress

# The web build (package-web.sh) needs the supported toolchain: pnpm from
# the packageManager pin + Node 24 LTS (see AGENTS.md "Toolchain
# environment"). Runner-default node is whatever the image ships — pin it.
- name: Setup pnpm
  uses: pnpm/action-setup@v6
  with:
    package_json_file: clients/package.json
- name: Setup Node.js
  uses: actions/setup-node@v7
  with:
    node-version: 24

- name: Build web UI → web-ui/
  shell: bash
  run: |
    ./scripts/package-web.sh --out "$PWD/web-ui"
