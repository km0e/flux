# Steps injected into every dist build job (.github/workflows/release.yml
# references this via dist's `github-build-setup` setting, path relative to
# .github/workflows/). Two prerequisites every platform needs before the
# cargo build:
#   1. protoc — flux-proto's build.rs compiles proto/ via prost-build.
#   2. web-ui/ — the browser UI bundle, built here so dist's
#      `include = ["web-ui/"]` lands it next to the binary in every archive.
- name: Install protoc
  uses: arduino/setup-protoc@v3
  with:
    repo-token: ${{ secrets.GITHUB_TOKEN }}

# The web build (package-web.sh) needs the supported toolchain: pnpm from
# the packageManager pin + Node 24 LTS (see AGENTS.md "Toolchain
# environment"). Runner-default node is whatever the image ships — pin it.
- name: Setup pnpm
  uses: pnpm/action-setup@v4
  with:
    package_json_file: clients/package.json
- name: Setup Node.js
  uses: actions/setup-node@v4
  with:
    node-version: 24

- name: Build web UI → web-ui/
  shell: bash
  run: |
    ./scripts/package-web.sh --out "$PWD/web-ui"
