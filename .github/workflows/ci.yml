name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    # bound a hung build/test — the default (360) would burn hours
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # flux-proto's build.rs compiles proto/ via prost-build, which shells
      # out to the system protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        # warm the next run even when this one fails — cold builds are
        # the single biggest CI cost on this repo (383 crates, aws-lc C)
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --tests -- -D warnings

      # prebuilt binary — compiling cargo-audit from source costs 10-15 min
      # on a cold runner, every cache miss
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cargo audit
        run: cargo audit

  web:
    runs-on: ubuntu-latest
    steps:
      # full history: buf breaking compares the contract against origin/main
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # The version comes from the packageManager pin.
          package_json_file: clients/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 LTS — THE supported line (see AGENTS.md "Toolchain
          # environment"); matches the `engines` declaration.
          node-version: 24
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml

      - name: Install dependencies (pnpm)
        working-directory: clients
        run: pnpm install --frozen-lockfile

      # The TS contracts are generated, never committed: lint + breaking +
      # derive them here so every later step (tsc/test/build) sees fresh
      # output and a stale checkout cannot ship a stale contract.
      - name: Proto contract checks
        working-directory: clients/web
        run: pnpm run proto:check

      - name: Typecheck
        working-directory: clients/web
        run: pnpm exec tsc --noEmit

      - name: Run frontend tests
        working-directory: clients/web
        run: pnpm test

      - name: Build the web UI
        working-directory: clients/web
        run: pnpm run build:fast
