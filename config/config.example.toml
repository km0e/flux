# Copy this file to `flux.toml` in the project root (or use any path with --config).
# `flux.toml` is gitignored so it will stay local.

[server]
mode = "stdio"    # or "tcp"
port = 8080

[provider]
# Use "openai" for OpenAI itself AND for OpenAI-compatible endpoints such as DeepSeek.
name = "openai"
model = "gpt-4o-mini"

# api selects which OpenAI endpoint family to use:
#   "completions" (default) -> /chat/completions, works with OpenAI and DeepSeek etc.
#   "responses"             -> /responses, OpenAI-native only.
api = "completions"

# base_url = "https://api.openai.com/v1"  # optional, default for OpenAI
# For DeepSeek use: base_url = "https://api.deepseek.com"  (or "https://api.deepseek.com/v1")
# base_url = "https://api.deepseek.com"
api_key = "sk-..."

workdir = "."

# System prompt / instructions sent to the agent on every request.
# If omitted, a default coding-assistant prompt is used.
# preamble = "You are a senior Rust engineer. Be concise and use the provided tools when needed."

# [[mcp_servers]]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/workspace"]
# [mcp_servers.env]
# SOME_VAR = "value"
