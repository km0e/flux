[workspace]
resolver = "2"
members = [
    "crates/flux-core",
    "crates/flux-macros",
    "crates/flux-loop",
    "crates/flux-provider",
    "crates/flux-proto",
    "crates/flux-chat",
    "crates/flux-session",
    "crates/flux-store",
    "crates/flux-test-support",
    "crates/flux-mcp",
    "crates/flux-server",
    "crates/flux-tools",
]

[workspace.package]
version = "0.2.0"
description = "A general-purpose coding agent framework in Rust with a browser chat UI frontend"
edition = "2024"
authors = ["Flux Contributors"]
license = "MIT"
repository = "https://github.com/km0e/flux"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
anyhow = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

# P4 spike — generated wire contracts (proto/ is the single source)
flux-proto = { path = "crates/flux-proto" }
# Test-only shared support (dev-dependency ONLY — see its crate docs)
flux-test-support = { path = "crates/flux-test-support" }
# reqwest 0.13 made rustls the default TLS backend (default-tls = ["rustls"]);
# native-tls was a leftover from the 0.12 era and dragged the whole OpenSSL
# stack into the tree — fatal for cross-compilation (zigbuild/xwin paths).
# `rustls` = rustls + aws-lc-rs provider + platform verifier (system roots).
# `system-proxy` restores env-var/registry proxy detection (default in 0.13,
# dropped by default-features = false) so `proxy <run>` style launches work.
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "system-proxy",
] }

# MCP
rmcp = { version = "3", features = ["client", "transport-child-process"] }

# The profile that 'dist' will build with — tuned for a SHIPPED, self-contained
# server binary (cargo bloat attribution, 2026-09): .text 16.7MB dominated by
# rmcp 2.3MB, C/asm natives ~2.5MB (sqlite3/aws-lc/zstd), std 1.6MB, the
# rustls/reqwest/h2/hyper client stack ~1.6MB; embedded UI 2.5MB in .rodata.
# - lto="fat" + codegen-units=1: cross-crate inlining/DCE shaves ~4.5MB of
#   .text vs thin (build ~4m vs ~2m50s per target — release-only cost).
# - strip="symbols": .symtab/.strtab are 8.2MB of dead weight with debug=0.
#   Tradeoff (accepted): RUST_BACKTRACE=1 in a shipped binary shows addresses
#   only — tool panics are caught and reported by payload (flux-chat
#   tool_exec), crash-only shutdown needs no symbolized stacks (T-11). Dev
#   builds keep [profile.release] unstripped for debugging.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
