[workspace]
resolver = "2"
members = [
    "crates/flux-core",
    "crates/flux-macros",
    "crates/flux-loop",
    "crates/flux-provider",
    "crates/flux-proto",
    "crates/flux-chat",
    "crates/flux-session",
    "crates/flux-store",
    "crates/flux-mcp",
    "crates/flux-server",
    "crates/flux-tools",
]

[workspace.package]
version = "0.1.3"
description = "A general-purpose coding agent framework in Rust with a browser chat UI frontend"
edition = "2024"
authors = ["Flux Contributors"]
license = "MIT"
repository = "https://github.com/km0e/flux"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
anyhow = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

# P4 spike — generated wire contracts (proto/ is the single source)
flux-proto = { path = "crates/flux-proto" }
# reqwest 0.13 made rustls the default TLS backend (default-tls = ["rustls"]);
# native-tls was a leftover from the 0.12 era and dragged the whole OpenSSL
# stack into the tree — fatal for cross-compilation (zigbuild/xwin paths).
# `rustls` = rustls + aws-lc-rs provider + platform verifier (system roots).
# `system-proxy` restores env-var/registry proxy detection (default in 0.13,
# dropped by default-features = false) so `proxy <run>` style launches work.
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "system-proxy",
] }

# MCP
rmcp = { version = "3", features = ["client", "transport-child-process"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
