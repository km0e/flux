[package]
name = "flux-chat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flux-core = { path = "../flux-core" }
flux-tools = { path = "../flux-tools" }
flux-loop = { path = "../flux-loop" }
flux-store = { path = "../flux-store" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
# The scripted provider/connection fakes live in flux-core behind its
# `test-util` feature (they fake flux-core traits; both planes share them).
flux-core = { path = "../flux-core", features = ["test-util"] }
