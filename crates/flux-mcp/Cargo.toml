[package]
name = "flux-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
flux-core = { path = "../flux-core" }
rmcp = { workspace = true, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
http = "1"
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# The Streamable HTTP loopback test hosts a real rmcp server (axum-mounted
# StreamableHttpService) and connects to it through production_connect's
# HTTP path — the features unify into the test build only.
rmcp = { workspace = true, features = [
    "server",
    "transport-streamable-http-server",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { workspace = true }
