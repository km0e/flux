[package]
name = "flux-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Generated protobuf/tonic contracts for the flux wire protocol"

[dependencies]
flux-core = { path = "../flux-core" }
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = [
    "codegen",
    "server",
    "channel",
] }
# tonic 0.14 split the prost codec out of tonic itself — the generated
# service code references `tonic_prost::ProstCodec`.
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"
